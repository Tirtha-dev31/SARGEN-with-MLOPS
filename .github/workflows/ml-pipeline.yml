name: ML Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DVC_VERSION: '3.30.0'

jobs:
  lint-and-test:
    name: Lint and Test Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=node_modules,sargen-app
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=node_modules,sargen-app
      continue-on-error: true
    
    - name: Run backend tests
      run: |
        pytest tests/ -v --tb=short || echo "No tests found or tests failed"
      continue-on-error: true

  dvc-pipeline:
    name: Run DVC ML Pipeline
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install "dvc[all]==${{ env.DVC_VERSION }}"
    
    - name: Set up DVC
      run: |
        dvc remote add -d local_storage .dvc/cache -f
        dvc pull || echo "No cached data yet"
    
    - name: Check if data exists
      id: check_data
      run: |
        if [ -f "data/HI-Small_Trans.csv" ]; then
          echo "data_exists=true" >> $GITHUB_OUTPUT
        else
          echo "data_exists=false" >> $GITHUB_OUTPUT
          echo "⚠️  Data files not found - skipping pipeline"
        fi
    
    - name: Run DVC pipeline
      if: steps.check_data.outputs.data_exists == 'true'
      run: |
        dvc repro
      env:
        MLFLOW_TRACKING_URI: ./mlruns
    
    - name: Check metrics
      if: steps.check_data.outputs.data_exists == 'true'
      run: |
        echo "=== Training Metrics ==="
        cat metrics/train_metrics.json || echo "No training metrics"
        echo ""
        echo "=== Evaluation Metrics ==="
        cat metrics/evaluation_metrics.json || echo "No evaluation metrics"
    
    - name: Upload model artifacts
      if: steps.check_data.outputs.data_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: |
          models/
          metrics/
          mlruns/
        retention-days: 30
    
    - name: Push DVC cache
      if: steps.check_data.outputs.data_exists == 'true'
      run: |
        dvc push || echo "DVC push failed or no remote configured"

  model-validation:
    name: Validate Model Performance
    runs-on: ubuntu-latest
    needs: dvc-pipeline
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: model-artifacts
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Validate model metrics
      run: |
        python -c "
        import json
        import sys
        
        # Load evaluation metrics
        try:
            with open('metrics/evaluation_metrics.json', 'r') as f:
                metrics = json.load(f)
        except FileNotFoundError:
            print('⚠️  No evaluation metrics found')
            sys.exit(0)
        
        # Define thresholds
        MIN_ACCURACY = 0.85
        MIN_F1 = 0.80
        
        accuracy = metrics.get('accuracy', 0)
        f1_score = metrics.get('f1_score', 0)
        
        print(f'Model Performance:')
        print(f'  Accuracy: {accuracy:.4f} (threshold: {MIN_ACCURACY})')
        print(f'  F1 Score: {f1_score:.4f} (threshold: {MIN_F1})')
        
        if accuracy < MIN_ACCURACY:
            print(f'❌ FAILED: Accuracy {accuracy:.4f} below threshold {MIN_ACCURACY}')
            sys.exit(1)
        
        if f1_score < MIN_F1:
            print(f'❌ FAILED: F1 Score {f1_score:.4f} below threshold {MIN_F1}')
            sys.exit(1)
        
        print('✅ Model meets quality thresholds')
        "
    
    - name: Comment PR with metrics
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let metrics = {};
          try {
            const data = fs.readFileSync('metrics/evaluation_metrics.json', 'utf8');
            metrics = JSON.parse(data);
          } catch (err) {
            console.log('No metrics file found');
            return;
          }
          
          const body = `## 🤖 Model Performance Report
          
          | Metric | Value |
          |--------|-------|
          | Accuracy | ${(metrics.accuracy * 100).toFixed(2)}% |
          | Precision | ${(metrics.precision * 100).toFixed(2)}% |
          | Recall | ${(metrics.recall * 100).toFixed(2)}% |
          | F1 Score | ${(metrics.f1_score * 100).toFixed(2)}% |
          ${metrics.auc_roc ? `| AUC-ROC | ${(metrics.auc_roc * 100).toFixed(2)}% |` : ''}
          
          **Top Features:**
          ${metrics.top_features ? metrics.top_features.slice(0, 5).map((f, i) => 
            `${i + 1}. ${f.feature}: ${(f.importance * 100).toFixed(2)}%`
          ).join('\n') : 'N/A'}
          
          ---
          🔗 [View full metrics](${context.payload.pull_request.html_url}/files)
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: model-validation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: staging
      url: https://staging.sargen.example.com
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: model-artifacts
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install mlflow boto3
    
    - name: Register model in MLflow
      run: |
        python -c "
        import mlflow
        import os
        
        mlflow.set_tracking_uri('./mlruns')
        
        # Get latest run from experiment
        experiment = mlflow.get_experiment_by_name('sargen_pattern_detection')
        if experiment:
            runs = mlflow.search_runs(experiment_ids=[experiment.experiment_id])
            if not runs.empty:
                latest_run_id = runs.iloc[0]['run_id']
                
                # Tag run as staging
                mlflow.set_tag('stage', 'staging')
                print(f'✓ Tagged run {latest_run_id} for staging deployment')
        "
    
    - name: Deploy notification
      run: |
        echo "🚀 Model deployed to staging environment"
        echo "Run ID: $(cat mlruns/*/meta.yaml | grep run_uuid | head -1 || echo 'unknown')"
