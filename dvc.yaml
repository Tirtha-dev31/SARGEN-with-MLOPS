# DVC pipeline stages for SARGEN ML workflow

stages:
  prepare_data:
    cmd: python scripts/prepare_data.py
    deps:
      - data/HI-Small_Trans.csv
      - data/HI-Small_accounts.csv
      - scripts/prepare_data.py
    params:
      - data
      - random_state
    outs:
      - data/prepared:
          cache: true
    desc: "Load and prepare raw transaction data"
  
  feature_engineering:
    cmd: python scripts/feature_engineering.py
    deps:
      - data/prepared
      - scripts/feature_engineering.py
    params:
      - features
      - random_state
    outs:
      - data/features:
          cache: true
    desc: "Engineer features from prepared transaction data"
  
  train:
    cmd: python scripts/train.py
    deps:
      - data/features
      - scripts/train.py
    params:
      - train
      - random_state
      - mlflow
    outs:
      - models/fraud_detector.pkl:
          cache: true
    metrics:
      - metrics/train_metrics.json:
          cache: false
    desc: "Train fraud detection model with MLflow tracking"
  
  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - models/fraud_detector.pkl
      - data/features
      - scripts/evaluate.py
    params:
      - evaluation
    metrics:
      - metrics/evaluation_metrics.json:
          cache: false
      - metrics/predictions.csv:
          cache: false
    desc: "Evaluate model performance and generate metrics"
